services:
  # ─────────────────────────────────────────────────────────────
  # Local LLM Server (Ollama)
  # ─────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: sovereign-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment deploy block if running with NVIDIA GPU Container Toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ─────────────────────────────────────────────────────────────
  # FastAPI Orchestrator & Multi-Agent Backend
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sovereign-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - DATABASE_URL=sqlite+aiosqlite:///app/data/workbench.db
      - ENVIRONMENT=production
    volumes:
      - backend_storage:/app/data
      - backend_deliverables:/app/generated_docs
      - /var/run/docker.sock:/var/run/docker.sock # Allows backend to invoke air-gapped sandbox containers
    depends_on:
      - ollama

  # ─────────────────────────────────────────────────────────────
  # React Client Portal
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sovereign-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  ollama_models:
  backend_storage:
  backend_deliverables:
